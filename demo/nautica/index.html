<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestionale rimessaggio</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
  <script>
    // index.html?a=pezzotti carica aziende/pezzotti.js, che sovrascrive nome, colore e pochi altri campi di config.js
    (function () {
      var m = /[?&]a=([a-z0-9-]+)/i.exec(location.search);
      if (m) document.write('<script src="aziende/' + m[1].toLowerCase() + '.js" onerror="window.AZIENDA_MANCANTE=\'' + m[1] + '\'"><\/script>');
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side"></aside>
    <header class="top" id="top"></header>
    <main class="main" id="view"></main>
    <nav class="bottom" id="bottom" aria-label="Navigazione"></nav>
  </div>
  <div id="print-root"></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/dati.js"></script>
  <script src="js/dati-stagione.js"></script>
  <script src="js/foto.js"></script>
  <script src="js/base.js"></script>
  <script src="js/v-cruscotto.js"></script>
  <script src="js/v-barche.js"></script>
  <script src="js/v-calendario.js"></script>
  <script src="js/v-lavori.js"></script>
  <script src="js/v-contratti.js"></script>
  <script src="js/v-magazzino.js"></script>
  <script src="js/v-ia.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
